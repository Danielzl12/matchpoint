{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post" class="form estrecho">
  <label>Identificador <input name="identificador" required autofocus></label>
  <label>Contraseña <input name="clave" type="password" required></label>
  <button class="boton">Entrar</button>
  <span class="nota">¿No tienes cuenta? <a href="/registro">Regístrate</a></span>
</form>
{% endblock %}
